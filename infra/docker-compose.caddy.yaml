services:
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - caddy_data:/data
      - ../staticfiles:/static:ro
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      - web

configs:
  caddy_config:
    content: |
      {
        http_port 8080
        https_port 8443
        auto_https disable_redirects
      }

      https://${CADDY_HOSTNAMES} http://${CADDY_HOSTNAMES} {

        tls ${TLS_MODE:-internal}

        handle_path /static/* {
          root * /static
          file_server
        }

        reverse_proxy web:8000 {
          header_up X-Forwarded-Proto https
          header_up Host {http.request.host}
        }
      }

volumes:
  caddy_data:
